container:
  name: map
  image: registry.infanasotku.com:5501/lastliter/map
  port: 8080

resources:
  requests: { cpu: 25m, memory: 32Mi }
  limits: { cpu: 100m, memory: 64Mi }

livenessProbe: &probe
  httpGet: { path: /healthz, port: http }
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
readinessProbe: *probe

config:
  yandexTilesApiKey: bfb82763-690f-4660-8064-037021895b65
